name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

  compatibility:
    name: Test (Node.js ${{ matrix.node }}, ESLint ${{ matrix.eslint }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # `lockfile` is the ESLint dev dependency from pnpm-lock.yaml, so it follows dependency
        # upgrades; 9.0.0 is the lower bound of `peerDependencies.eslint`. The `test` job already
        # covers the lockfile ESLint on `.nvmrc`.
        include:
          - node: 24
            eslint: lockfile
          - node: 24
            eslint: 9.0.0
          - node: 26
            eslint: 9.0.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Pin ESLint ${{ matrix.eslint }}
        if: matrix.eslint != 'lockfile'
        run: pnpm add -D eslint@${{ matrix.eslint }}

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  smoke:
    name: Smoke test (Node.js 22, ESLint ${{ matrix.eslint }})
    # Covers the `engines.node` lower bound: the built plugin must load and fix code on Node.js 22,
    # even though the test suite itself needs Node.js 24.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        eslint:
          - lockfile
          - 9.0.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Pin ESLint ${{ matrix.eslint }}
        if: matrix.eslint != 'lockfile'
        run: pnpm add -D eslint@${{ matrix.eslint }}

      - name: Build
        run: pnpm build

      - name: Smoke test
        run: node tests/smoke.js
